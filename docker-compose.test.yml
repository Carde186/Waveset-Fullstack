name: waveset-test

services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?imposta MYSQL_ROOT_PASSWORD in .env.test}
            MYSQL_DATABASE: waveset_test
            MYSQL_USER: ${DB_USER:?imposta DB_USER in .env.test}
            MYSQL_PASSWORD: ${DB_PASSWORD:?imposta DB_PASSWORD in .env.test}
        ports:
            - "127.0.0.1:${MYSQL_HOST_PORT:-3308}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./backend/db/init:/docker-entrypoint-initdb.d:ro
        # Ping via TCP: vedi docker-compose.yml.
        healthcheck:
            test: ["CMD-SHELL", 'mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        restart: "no"

    seed-test:
        image: mysql:8.4
        entrypoint: ["/bin/sh", "-ec"]
        command:
            - |
                for f in /seed/*.sql; do
                    echo "seed test: $$f"
                    mysql -h mysql -u"$$DB_USER" waveset_test < "$$f"
                done
        environment:
            DB_USER: ${DB_USER}
            MYSQL_PWD: ${DB_PASSWORD}
        volumes:
            - ./backend/db/test:/seed:ro
        depends_on:
            mysql:
                condition: service_healthy
        restart: "no"

    backend:
        build: ./backend
        ports:
            - "127.0.0.1:${BACKEND_HOST_PORT:-3001}:3000"
        environment:
            OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
            OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
            OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-45000}
            OLLAMA_SOGLIA_CONFIDENZA: ${OLLAMA_SOGLIA_CONFIDENZA:-0.85}
            OLLAMA_MAX_TENTATIVI: ${OLLAMA_MAX_TENTATIVI:-3}
            OLLAMA_CONCORRENZA: ${OLLAMA_CONCORRENZA:-1}
            OLLAMA_INTERVALLO_MS: ${OLLAMA_INTERVALLO_MS:-30000}
            OLLAMA_LOTTO: ${OLLAMA_LOTTO:-20}
            PORT: "3000"
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: waveset_test
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
            TICKETMASTER_SYNC_ENABLED: ${TICKETMASTER_SYNC_ENABLED:-true}
            TICKETMASTER_SYNC_INTERVAL_SEC: ${TICKETMASTER_SYNC_INTERVAL_SEC:-28800}
            TICKETMASTER_SYNC_STALE_SEC: ${TICKETMASTER_SYNC_STALE_SEC:-86400}
            TICKETMASTER_SYNC_MAX_ARTISTS: ${TICKETMASTER_SYNC_MAX_ARTISTS:-50}
            TICKETMASTER_SYNC_MAX_PAGES: ${TICKETMASTER_SYNC_MAX_PAGES:-4}
            TICKETMASTER_SYNC_MAX_REQUESTS: ${TICKETMASTER_SYNC_MAX_REQUESTS:-300}
            TICKETMASTER_SYNC_TIMEOUT_MS: ${TICKETMASTER_SYNC_TIMEOUT_MS:-10000}
            # Rate limit: nei test molto più alto dei valori normali
            # (registrazione 30 per IP; login 10 fallimenti per IP+email, 50
            # fallimenti e 100 tentativi totali per IP, ogni 900 s), perché
            # la suite registra e accede decine di volte dallo stesso IP. I
            # limitatori veri sono provati a parte, con soglie basse
            # (registrazioneLimite, loginLimite).
            RATE_LIMIT_REGISTRAZIONE_MAX: ${RATE_LIMIT_REGISTRAZIONE_MAX:-1000}
            RATE_LIMIT_REGISTRAZIONE_FINESTRA_SEC: ${RATE_LIMIT_REGISTRAZIONE_FINESTRA_SEC:-900}
            RATE_LIMIT_LOGIN_COPPIA_MAX: ${RATE_LIMIT_LOGIN_COPPIA_MAX:-1000}
            RATE_LIMIT_LOGIN_IP_FALLIMENTI_MAX: ${RATE_LIMIT_LOGIN_IP_FALLIMENTI_MAX:-1000}
            RATE_LIMIT_LOGIN_IP_TOTALE_MAX: ${RATE_LIMIT_LOGIN_IP_TOTALE_MAX:-10000}
            RATE_LIMIT_LOGIN_FINESTRA_SEC: ${RATE_LIMIT_LOGIN_FINESTRA_SEC:-900}
            # Sessione browser: l'origine esatta è quella che il browser usa per
            # aprire il frontend di test (stessa porta pubblicata più sotto).
            # FRONTEND_ORIGINS_TEST serve solo a provare il caso "web non
            # configurato": impostata VUOTA (non assente) disabilita la sessione web.
            FRONTEND_ORIGINS: ${FRONTEND_ORIGINS_TEST-http://localhost:${FRONTEND_HOST_PORT:-5175}}
            # Qui il frontend è servito in HTTP su localhost, quindi il cookie
            # non può essere Secure. Vale SOLO per questo Compose di test:
            # con HTTPS (e in produzione) COOKIE_SECURE va impostato a true.
            COOKIE_SECURE: "false"
            ARTISTI_PROVIDER: ${ARTISTI_PROVIDER:-deezer}
            DEEZER_TIMEOUT_MS: ${DEEZER_TIMEOUT_MS:-8000}
            APPLE_MUSIC_TEAM_ID: ${APPLE_MUSIC_TEAM_ID:-}
            APPLE_MUSIC_KEY_ID: ${APPLE_MUSIC_KEY_ID:-}
            APPLE_MUSIC_PRIVATE_KEY: ${APPLE_MUSIC_PRIVATE_KEY:-}
            APPLE_MUSIC_STOREFRONT: ${APPLE_MUSIC_STOREFRONT:-}
            APPLE_MUSIC_TOKEN_TTL: ${APPLE_MUSIC_TOKEN_TTL:-3600}
            APPLE_MUSIC_TIMEOUT_MS: ${APPLE_MUSIC_TIMEOUT_MS:-10000}
        depends_on:
            ollama-schema:
                condition: service_completed_successfully
            mysql:
                condition: service_healthy
            apple-music-schema:
                condition: service_completed_successfully
            ticketmaster-schema:
                condition: service_completed_successfully
            seed-test:
                condition: service_completed_successfully
        restart: "no"

    frontend:
        # Solo verifiche browser esplicite: lo sviluppo usa docker-compose.yml su 5174.
        profiles: ["browser"]
        build:
            context: ./frontend
            args:
                VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
                VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
        ports:
            - "127.0.0.1:${FRONTEND_HOST_PORT:-5175}:80"
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
            interval: 5s
            timeout: 3s
            retries: 10
        depends_on:
            - backend
        restart: "no"

    apple-music-schema:
        build: ./backend
        command: ["node", "scripts/preparaAppleMusic.js", "--applica"]
        environment:
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: waveset_test
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
        depends_on:
            mysql:
                condition: service_healthy
        restart: "no"

    ticketmaster-schema:
        build: ./backend
        command: ["node", "scripts/preparaSincronizzazioneTicketmaster.js", "--applica"]
        environment:
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: waveset_test
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
        depends_on:
            mysql:
                condition: service_healthy
        restart: "no"

    ticketmaster-sync:
        build: ./backend
        command: ["node", "scripts/sincronizzaTicketmaster.js", "--continuo"]
        environment:
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: waveset_test
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
            TICKETMASTER_SYNC_ENABLED: ${TICKETMASTER_SYNC_ENABLED:-true}
            TICKETMASTER_SYNC_INTERVAL_SEC: ${TICKETMASTER_SYNC_INTERVAL_SEC:-28800}
            TICKETMASTER_SYNC_STALE_SEC: ${TICKETMASTER_SYNC_STALE_SEC:-86400}
            TICKETMASTER_SYNC_MAX_ARTISTS: ${TICKETMASTER_SYNC_MAX_ARTISTS:-50}
            TICKETMASTER_SYNC_MAX_PAGES: ${TICKETMASTER_SYNC_MAX_PAGES:-4}
            TICKETMASTER_SYNC_MAX_REQUESTS: ${TICKETMASTER_SYNC_MAX_REQUESTS:-300}
            TICKETMASTER_SYNC_TIMEOUT_MS: ${TICKETMASTER_SYNC_TIMEOUT_MS:-10000}
        depends_on:
            ollama-schema:
                condition: service_completed_successfully
            mysql:
                condition: service_healthy
            ticketmaster-schema:
                condition: service_completed_successfully
        restart: unless-stopped
        stop_grace_period: 45s

    ollama-schema:
        build: ./backend
        command: ["node", "scripts/preparaOllama.js", "--applica"]
        environment:
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: waveset_test
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
        depends_on:
            mysql:
                condition: service_healthy
            ticketmaster-schema:
                condition: service_completed_successfully
            apple-music-schema:
                condition: service_completed_successfully
        restart: "no"

    ollama-eventi:
        build: ./backend
        command: ["node", "scripts/validaEventiOllama.js", "--continuo"]
        environment:
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: waveset_test
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            ARTISTI_PROVIDER: ${ARTISTI_PROVIDER:-deezer}
            OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
            OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
            OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-45000}
            OLLAMA_SOGLIA_CONFIDENZA: ${OLLAMA_SOGLIA_CONFIDENZA:-0.85}
            OLLAMA_MAX_TENTATIVI: ${OLLAMA_MAX_TENTATIVI:-3}
            OLLAMA_CONCORRENZA: ${OLLAMA_CONCORRENZA:-1}
            OLLAMA_INTERVALLO_MS: ${OLLAMA_INTERVALLO_MS:-30000}
            OLLAMA_LOTTO: ${OLLAMA_LOTTO:-20}
        depends_on:
            ollama-schema:
                condition: service_completed_successfully
        restart: unless-stopped
        stop_grace_period: 55s

volumes:
    mysql_data:
        name: waveset_test_mysql_data
