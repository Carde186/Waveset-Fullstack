# Una sola origine per il browser: pagine e /api passano da qui, quindi niente
# CORS e il cookie di sessione (Path=/api) resta sulla stessa origine.
#
# `backend` è il nome del servizio nella rete Compose: dentro il container
# `localhost` sarebbe nginx stesso, non il backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        # Senza URI nel proxy_pass il percorso arriva al backend invariato.
        # Origin, Cookie e X-CSRF-Token sono inoltrati così come li manda il
        # browser; le risposte (anche Set-Cookie) tornano indietro intatte.
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        # Risposte con sessione/CSRF: mai da una cache intermedia.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # File con hash nel nome: cache lunga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Applicazione a pagina singola: i percorsi di react-router tornano a index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri /index.html;
    }
}
