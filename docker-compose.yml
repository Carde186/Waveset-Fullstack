name: waveset-fullstack

services:
    ollama:
        image: ollama/ollama:0.35.1
        environment:
            OLLAMA_HOST: "0.0.0.0:11434"
            OLLAMA_CONTEXT_LENGTH: "4096"
        volumes:
            - ollama_data:/root/.ollama
        healthcheck:
            test: ["CMD", "ollama", "list"]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: unless-stopped

    ollama-model:
        image: ollama/ollama:0.35.1
        environment:
            OLLAMA_HOST: "http://ollama:11434"
            OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
            OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
        entrypoint: ["/bin/sh", "-ec"]
        command:
            - |
                case "$$OLLAMA_URL" in
                    http://ollama:11434|http://ollama:11434/)
                        ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1 || ollama pull "$$OLLAMA_MODEL"
                        ;;
                    *) echo "Ollama esterno: predisporre il modello sul server configurato." ;;
                esac
        depends_on:
            ollama:
                condition: service_healthy
        restart: "no"

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?imposta MYSQL_ROOT_PASSWORD in .env}
            MYSQL_DATABASE: ${DB_NAME:?imposta DB_NAME in .env}
            MYSQL_USER: ${DB_USER:?imposta DB_USER in .env}
            MYSQL_PASSWORD: ${DB_PASSWORD:?imposta DB_PASSWORD in .env}
        ports:
            - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./backend/db/init:/docker-entrypoint-initdb.d:ro
        # Ping via TCP: durante l'init l'entrypoint avvia un server temporaneo
        # con --skip-networking (solo socket). Un ping sul socket risponderebbe
        # "healthy" prima che schema e seed siano stati eseguiti.
        healthcheck:
            test: ["CMD-SHELL", 'mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        restart: unless-stopped

    admin-init:
        build: ./backend
        command: ["node", "scripts/creaAdmin.js"]
        environment:
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            ADMIN_EMAIL: ${ADMIN_EMAIL:?imposta ADMIN_EMAIL in .env}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:?imposta ADMIN_PASSWORD in .env}
            ADMIN_NOME: ${ADMIN_NOME:-Admin}
        depends_on:
            mysql:
                condition: service_healthy
        restart: "no"

    backend:
        build: ./backend
        ports:
            - "127.0.0.1:${BACKEND_HOST_PORT:-3002}:3000"
        environment:
            OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
            OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
            OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-120000}
            OLLAMA_SOGLIA_CONFIDENZA: ${OLLAMA_SOGLIA_CONFIDENZA:-0.85}
            OLLAMA_MAX_TENTATIVI: ${OLLAMA_MAX_TENTATIVI:-3}
            OLLAMA_CONCORRENZA: ${OLLAMA_CONCORRENZA:-1}
            OLLAMA_INTERVALLO_MS: ${OLLAMA_INTERVALLO_MS:-30000}
            OLLAMA_LOTTO: ${OLLAMA_LOTTO:-20}
            PORT: "3000"
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
            FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:${FRONTEND_HOST_PORT:-5174}}
            COOKIE_SECURE: ${COOKIE_SECURE:-false}
            GOOGLE_GEOCODING_API_KEY: ${GOOGLE_GEOCODING_API_KEY:-}
            TICKETMASTER_SYNC_ENABLED: ${TICKETMASTER_SYNC_ENABLED:-true}
            TICKETMASTER_SYNC_INTERVAL_SEC: ${TICKETMASTER_SYNC_INTERVAL_SEC:-28800}
            TICKETMASTER_SYNC_STALE_SEC: ${TICKETMASTER_SYNC_STALE_SEC:-86400}
            TICKETMASTER_SYNC_MAX_ARTISTS: ${TICKETMASTER_SYNC_MAX_ARTISTS:-50}
            TICKETMASTER_SYNC_MAX_PAGES: ${TICKETMASTER_SYNC_MAX_PAGES:-4}
            TICKETMASTER_SYNC_MAX_REQUESTS: ${TICKETMASTER_SYNC_MAX_REQUESTS:-300}
            TICKETMASTER_SYNC_TIMEOUT_MS: ${TICKETMASTER_SYNC_TIMEOUT_MS:-10000}
            # Rate limit, valori NORMALI (finestre di 15 minuti): registrazione
            # 30 richieste per IP; login 10 fallimenti per IP+email, 50
            # fallimenti e 100 tentativi totali per IP. Si cambiano da .env.
            RATE_LIMIT_REGISTRAZIONE_MAX: ${RATE_LIMIT_REGISTRAZIONE_MAX:-30}
            RATE_LIMIT_REGISTRAZIONE_FINESTRA_SEC: ${RATE_LIMIT_REGISTRAZIONE_FINESTRA_SEC:-900}
            RATE_LIMIT_LOGIN_COPPIA_MAX: ${RATE_LIMIT_LOGIN_COPPIA_MAX:-10}
            RATE_LIMIT_LOGIN_IP_FALLIMENTI_MAX: ${RATE_LIMIT_LOGIN_IP_FALLIMENTI_MAX:-50}
            RATE_LIMIT_LOGIN_IP_TOTALE_MAX: ${RATE_LIMIT_LOGIN_IP_TOTALE_MAX:-100}
            RATE_LIMIT_LOGIN_FINESTRA_SEC: ${RATE_LIMIT_LOGIN_FINESTRA_SEC:-900}
            ARTISTI_PROVIDER: ${ARTISTI_PROVIDER:-deezer}
            DEEZER_TIMEOUT_MS: ${DEEZER_TIMEOUT_MS:-8000}
        depends_on:
            ollama-model:
                condition: service_completed_successfully
            ollama-schema:
                condition: service_completed_successfully
            mysql:
                condition: service_healthy
            artisti-provider-schema:
                condition: service_completed_successfully
            ticketmaster-schema:
                condition: service_completed_successfully
            admin-init:
                condition: service_completed_successfully
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            args:
                VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
                VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
        ports:
            - "127.0.0.1:${FRONTEND_HOST_PORT:-5174}:80"
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
            interval: 5s
            timeout: 3s
            retries: 10
        depends_on:
            - backend
        restart: unless-stopped

    artisti-provider-schema:
        build: ./backend
        command: ["node", "scripts/preparaProviderArtisti.js", "--applica"]
        environment:
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
        depends_on:
            mysql:
                condition: service_healthy
        restart: "no"

    ticketmaster-schema:
        build: ./backend
        command: ["node", "scripts/preparaSincronizzazioneTicketmaster.js", "--applica"]
        environment:
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
        depends_on:
            mysql:
                condition: service_healthy
        restart: "no"

    ticketmaster-sync:
        build: ./backend
        command: ["node", "scripts/sincronizzaTicketmaster.js", "--continuo"]
        environment:
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
            TICKETMASTER_SYNC_ENABLED: ${TICKETMASTER_SYNC_ENABLED:-true}
            TICKETMASTER_SYNC_INTERVAL_SEC: ${TICKETMASTER_SYNC_INTERVAL_SEC:-28800}
            TICKETMASTER_SYNC_STALE_SEC: ${TICKETMASTER_SYNC_STALE_SEC:-86400}
            TICKETMASTER_SYNC_MAX_ARTISTS: ${TICKETMASTER_SYNC_MAX_ARTISTS:-50}
            TICKETMASTER_SYNC_MAX_PAGES: ${TICKETMASTER_SYNC_MAX_PAGES:-4}
            TICKETMASTER_SYNC_MAX_REQUESTS: ${TICKETMASTER_SYNC_MAX_REQUESTS:-300}
            TICKETMASTER_SYNC_TIMEOUT_MS: ${TICKETMASTER_SYNC_TIMEOUT_MS:-10000}
        depends_on:
            ollama-schema:
                condition: service_completed_successfully
            mysql:
                condition: service_healthy
            ticketmaster-schema:
                condition: service_completed_successfully
        restart: unless-stopped
        stop_grace_period: 45s

    ollama-schema:
        build: ./backend
        command: ["node", "scripts/preparaOllama.js", "--applica"]
        environment:
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
        depends_on:
            mysql:
                condition: service_healthy
            ticketmaster-schema:
                condition: service_completed_successfully
            artisti-provider-schema:
                condition: service_completed_successfully
        restart: "no"

    ollama-eventi:
        build: ./backend
        command: ["node", "scripts/validaEventiOllama.js", "--continuo"]
        environment:
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            ARTISTI_PROVIDER: ${ARTISTI_PROVIDER:-deezer}
            OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
            OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
            OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-120000}
            OLLAMA_SOGLIA_CONFIDENZA: ${OLLAMA_SOGLIA_CONFIDENZA:-0.85}
            OLLAMA_MAX_TENTATIVI: ${OLLAMA_MAX_TENTATIVI:-3}
            OLLAMA_CONCORRENZA: ${OLLAMA_CONCORRENZA:-1}
            OLLAMA_INTERVALLO_MS: ${OLLAMA_INTERVALLO_MS:-30000}
            OLLAMA_LOTTO: ${OLLAMA_LOTTO:-20}
        depends_on:
            ollama-model:
                condition: service_completed_successfully
            ollama-schema:
                condition: service_completed_successfully
        restart: unless-stopped
        stop_grace_period: 55s

volumes:
    ollama_data:
    mysql_data:
        name: waveset_fullstack_mysql_data
